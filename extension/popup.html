<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ATSIQ Capture</title>
    <style>
      :root { color-scheme: light; }
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font: 13px/1.5 "Space Grotesk", system-ui, sans-serif;
        color: #0b0b0f;
        background: #fff;
      }
      h1 { font-size: 15px; margin: 0 0 12px; letter-spacing: -0.01em; }
      label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #6b7280; margin: 12px 0 4px; }
      input, select {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        font: inherit;
        background: #fff;
      }
      button {
        width: 100%;
        margin-top: 14px;
        padding: 10px;
        border: 0;
        border-radius: 999px;
        background: #584dff;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button.ghost { background: #edf0f5; color: #0b0b0f; margin-top: 8px; }
      button[disabled] { opacity: 0.6; cursor: default; }
      #status { margin-top: 12px; font-size: 12px; color: #374151; min-height: 18px; }
      #status.err { color: #b42318; }
      #status.ok { color: #027a48; }
      .hint { font-size: 11px; color: #6b7280; margin-top: 10px; }
    </style>
  </head>
  <body>
    <h1>ATSIQ Capture</h1>

    <label for="site">Your ATSIQ address</label>
    <input id="site" type="url" placeholder="https://atsiq.yavar.ai" />

    <label for="token">Capture key</label>
    <input id="token" type="password" placeholder="Paste from Integrations" />

    <label for="kind">Send this page as</label>
    <select id="kind">
      <option value="cv">A candidate CV</option>
      <option value="jd">A job description</option>
    </select>

    <button id="send">Capture this page</button>
    <button id="save" class="ghost">Save settings</button>

    <div id="status"></div>
    <p class="hint">
      Reads only the page you are on, in your own browser, when you press the button.
      Nothing runs in the background.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
